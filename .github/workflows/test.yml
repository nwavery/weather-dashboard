name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The render tests (test/defaultView.test.js, test/cardView.test.js) load
      # the components through Vite with React, so dependencies are installed.
      - run: npm ci
      - run: node --test
